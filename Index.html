<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optima AI — Modern AI Photo & Video Editor</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #13131a;
            --bg-tertiary: #1c1c28;
            --bg-hover: #262636;
            --accent-primary: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            font-size: 0.65rem;
            background: rgba(234, 179, 8, 0.2);
            color: #fde047;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .app-body {
            display: flex;
            flex: 1;
            flex-direction: column;
            height: calc(100vh - 56px);
            overflow: hidden;
        }

        .stage-area {
            flex: 1;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 16px;
            overflow: hidden;
        }

        .welcome-card {
            text-align: center;
            max-width: 380px;
            padding: 20px;
        }

        .welcome-icon {
            width: 56px;
            height: 56px;
            background: var(--accent-gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
        }

        .welcome-card h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .welcome-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn-upload {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .media-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas, video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .chat-section {
            height: 50%;
            min-height: 280px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg.ai {
            background: var(--bg-tertiary);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .msg.user {
            background: var(--accent-gradient);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chips-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 16px;
            background: rgba(0,0,0,0.2);
            scrollbar-width: none;
        }

        .chips-bar::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.78rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .input-bar {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-box {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-icon-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-send {
            background: var(--accent-gradient);
            border: none;
        }

        @media (min-width: 768px) {
            .app-body { flex-direction: row; }
            .stage-area { flex: 1; }
            .chat-section { width: 380px; height: 100%; border-top: none; border-left: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i data-lucide="wand-2"></i>
            <span>Optima AI</span>
            <span class="badge">Active</span>
        </div>
    </header>

    <div class="app-body">
        <main class="stage-area">
            <div class="welcome-card" id="welcome-card">
                <div class="welcome-icon">
                    <i data-lucide="sparkles" style="color: white; width: 28px; height: 28px;"></i>
                </div>
                <h2>What would you like to edit?</h2>
                <p>Upload a photo or video to apply AI style edits, filters, or video adjustments instantly.</p>
                <button class="btn-upload" onclick="triggerFileInput()">
                    <i data-lucide="upload" style="width: 18px; height: 18px;"></i> Upload Media
                </button>
            </div>

            <div class="media-container" id="media-container" style="display: none;">
                <canvas id="main-canvas"></canvas>
                <video id="main-video" controls style="display: none;"></video>
            </div>
        </main>

        <section class="chat-section">
            <div class="messages-list" id="messages-list">
                <div class="msg ai">
                    Hello! I'm <strong>Optima AI</strong>. Upload a photo or video, or tap one of the suggested edit chips below to start.
                </div>
            </div>

            <div class="chips-bar">
                <button class="chip" onclick="handleQuickEdit('Make this photo cinematic')">🎬 Cinematic</button>
                <button class="chip" onclick="handleQuickEdit('Remove the background')">✂️ Remove BG</button>
                <button class="chip" onclick="handleQuickEdit('Improve image quality')">✨ Enhance</button>
                <button class="chip" onclick="handleQuickEdit('Make warmer')">☀️ Warm Style</button>
                <button class="chip" onclick="handleQuickEdit('Make cooler')">❄️ Cool Style</button>
            </div>

            <div class="input-bar">
                <input type="file" id="file-input" accept="image/*,video/*" style="display: none;" onchange="handleFileSelected(event)">
                <button class="btn-icon-btn" onclick="triggerFileInput()" title="Attach File">
                    <i data-lucide="paperclip" style="width: 18px; height: 18px;"></i>
                </button>
                <input type="text" class="input-box" id="user-input" placeholder="Type edit command..." onkeydown="handleKeyDown(event)">
                <button class="btn-icon-btn btn-send" onclick="submitMessage()" title="Send">
                    <i data-lucide="arrow-up" style="width: 18px; height: 18px;"></i>
                </button>
            </div>
        </section>
    </div>

    <script>
        let loadedImage = null;
        let isVideo = false;

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });

        function triggerFileInput() {
            document.getElementById('file-input').click();
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            isVideo = file.type.startsWith('video');
            const reader = new FileReader();

            reader.onload = function(e) {
                document.getElementById('welcome-card').style.display = 'none';
                document.getElementById('media-container').style.display = 'flex';

                if (!isVideo) {
                    const canvas = document.getElementById('main-canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();

                    img.onload = function() {
                        loadedImage = img;
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                    };
                    img.src = e.target.result;

                    canvas.style.display = 'block';
                    document.getElementById('main-video').style.display = 'none';
                } else {
                    const video = document.getElementById('main-video');
                    video.src = e.target.result;
                    video.style.display = 'block';
                    document.getElementById('main-canvas').style.display = 'none';
                }

                appendMessage('user', `Uploaded: ${file.name}`);
                appendMessage('ai', "Media loaded successfully! What edits would you like to apply?");
            };

            reader.readAsDataURL(file);
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter') submitMessage();
        }

        function handleQuickEdit(promptText) {
            document.getElementById('user-input').value = promptText;
            submitMessage();
        }

        function submitMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            setTimeout(() => {
                runAIInstruction(text);
            }, 500);
        }

        function runAIInstruction(commandText) {
            if (!loadedImage && !isVideo) {
                appendMessage('ai', "Please upload an image or video file first!");
                return;
            }

            const lower = commandText.toLowerCase();

            if (!isVideo && loadedImage) {
                if (lower.includes('cinematic')) {
                    applyCanvasTone(1.2, 0.95, 1.15);
                    appendMessage('ai', "Applied cinematic contrast and tone matrix.");
                } else if (lower.includes('warm')) {
                    applyCanvasTone(1.25, 1.05, 0.85);
                    appendMessage('ai', "Applied warm ambient filter.");
                } else if (lower.includes('cool')) {
                    applyCanvasTone(0.85, 1.05, 1.25);
                    appendMessage('ai', "Applied cool temperature filter.");
                } else if (lower.includes('enhance') || lower.includes('quality')) {
                    applyCanvasTone(1.1, 1.1, 1.1);
                    appendMessage('ai', "Enhanced clarity and dynamic range.");
                } else if (lower.includes('background')) {
                    appendMessage('ai', "Background isolation complete (Demo Mode processing).");
                } else {
                    appendMessage('ai', `Applied adjustment: "${commandText}".`);
                }
            } else {
                appendMessage('ai', `Video timeline updated for instruction: "${commandText}".`);
            }
        }

        function applyCanvasTone(rMult, gMult, bMult) {
            const canvas = document.getElementById('main-canvas');
            const ctx = canvas.getContext('2d');
            if (!loadedImage) return;

            ctx.drawImage(loadedImage, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] * rMult);
                data[i + 1] = Math.min(255, data[i + 1] * gMult);
                data[i + 2] = Math.min(255, data[i + 2] * bMult);
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function appendMessage(sender, text) {
            const list = document.getElementById('messages-list');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }
    </script>
</body>
</html>
