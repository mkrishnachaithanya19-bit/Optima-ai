<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#13131a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Optima AI Studio</title>
    
    <!-- PWA Web App Manifest directly embedded -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Optima AI Studio","short_name":"Optima AI","start_url":"/","display":"standalone","background_color":"#0a0a0c","theme_color":"#13131a"}'>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0a0a0c; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 10px 16px; background: #13131a; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
        .brand { font-weight: 800; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 8px; }
        .brand-text { background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-sm { background: #6366f1; border: none; color: #fff; padding: 6px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; position: relative; overflow: hidden; background: #070709; }
        canvas { max-width: 100%; max-height: 240px; border-radius: 12px; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        .studio-panel { height: 340px; background: #13131a; border-top: 1px solid #222; display: flex; flex-direction: column; }
        .tab-bar { display: flex; background: #0a0a0c; border-bottom: 1px solid #222; }
        .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #888; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #a855f7; border-bottom: 2px solid #a855f7; background: #13131a; }
        .tab-content { flex: 1; overflow-y: auto; padding: 12px; display: none; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }
        .messages { display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; max-width: 85%; }
        .msg.ai { background: #1c1c28; align-self: flex-start; }
        .msg.user { background: #6366f1; align-self: flex-end; }
        .input-bar { padding: 8px 12px; display: flex; gap: 8px; background: #13131a; border-top: 1px solid #222; align-items: center; }
        input[type="text"] { flex: 1; background: #1c1c28; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 18px; outline: none; }
        .btn-plus { background: #1c1c28; border: 1px solid #333; color: #a855f7; width: 36px; height: 36px; border-radius: 50%; font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-send { background: #6366f1; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <svg width="28" height="28" viewBox="0 0 512 512">
                <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>
                <rect width="512" height="512" rx="120" fill="url(#logoBg)"/>
                <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="24" stroke-opacity="0.3"/>
                <path d="M 170 340 L 290 220" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
                <path d="M 330 140 Q 330 175 365 175 Q 330 175 330 210 Q 330 175 295 175 Q 330 175 330 140 Z" fill="#ffffff"/>
            </svg>
            <span class="brand-text">Optima AI Studio</span>
        </div>
        <button class="btn-sm" onclick="downloadImage()">💾 Save</button>
    </header>

    <div class="stage">
        <div id="welcome" style="text-align:center;">
            <h2>Upload Photo to Begin</h2>
            <button onclick="document.getElementById('file-input').click()" style="background: linear-gradient(135deg, #6366f1, #a855f7); color:#fff; border:none; padding:10px 20px; border-radius:20px; font-weight:bold; margin-top:10px; cursor:pointer;">+ Select Photo</button>
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="studio-panel">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('ai-tab')">AI Assistant</button>
            <button class="tab-btn" onclick="switchTab('adjust-tab')">Adjustments</button>
        </div>

        <div class="tab-content active" id="ai-tab">
            <div class="messages" id="messages">
                <div class="msg ai">Hello! Upload a photo and tap filters or type prompts to edit.</div>
            </div>
        </div>

        <div class="tab-content" id="adjust-tab">
            <label style="font-size:0.8rem;">Brightness
                <input type="range" id="slider-bright" min="50" max="150" value="100" oninput="renderCanvas()" style="width:100%;">
            </label>
            <label style="font-size:0.8rem;">Contrast
                <input type="range" id="slider-contrast" min="50" max="150" value="100" oninput="renderCanvas()" style="width:100%;">
            </label>
        </div>

        <div class="input-bar">
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="loadFile(event)">
            <button class="btn-plus" onclick="document.getElementById('file-input').click()">+</button>
            <input type="text" id="text-input" placeholder="Type prompt..." onkeydown="if(event.key==='Enter') send()">
            <button class="btn-send" onclick="send()">➔</button>
        </div>
    </div>

    <script>
        let originalImg = null;
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
        function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('welcome').style.display = 'none';
                const canvas = document.getElementById('canvas');
                const img = new Image();
                img.onload = function() {
                    originalImg = img;
                    renderCanvas();
                    canvas.style.display = 'block';
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }
        function renderCanvas() {
            if (!originalImg) return;
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = originalImg.width;
            canvas.height = originalImg.height;
            ctx.drawImage(originalImg, 0, 0);

            const b = document.getElementById('slider-bright').value / 100;
            const c = document.getElementById('slider-contrast').value / 100;

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                d[i] = Math.min(255, Math.max(0, (d[i] - 128) * c + 128 * b));
                d[i+1] = Math.min(255, Math.max(0, (d[i+1] - 128) * c + 128 * b));
                d[i+2] = Math.min(255, Math.max(0, (d[i+2] - 128) * c + 128 * b));
            }
            ctx.putImageData(imgData, 0, 0);

            // Watermark
            const wmSize = Math.max(14, Math.floor(canvas.width * 0.035));
            ctx.font = `700 ${wmSize}px sans-serif`;
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            ctx.textAlign = "right";
            ctx.fillText("✨ Optima AI Studio", canvas.width - wmSize, canvas.height - wmSize);
        }
        function downloadImage() {
            const canvas = document.getElementById('canvas');
            if (!originalImg) return;
            const link = document.createElement('a');
            link.download = 'optima-ai-edit.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        function send() {
            const input = document.getElementById('text-input');
            if (!input.value.trim()) return;
            const box = document.getElementById('messages');
            box.innerHTML += `<div class="msg user">${input.value}</div>`;
            const val = input.value;
            input.value = '';
            setTimeout(() => {
                box.innerHTML += `<div class="msg ai">Processed instruction: "${val}"</div>`;
            }, 400);
        }
    </script>
</body>
</html>
