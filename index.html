<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optima AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0a0a0c; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 16px; background: #13131a; border-bottom: 1px solid #222; text-align: center; font-weight: bold; font-size: 1.2rem; color: #a855f7; }
        .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; position: relative; }
        .welcome { text-align: center; }
        .btn-upload { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border: none; padding: 14px 24px; border-radius: 24px; font-weight: bold; font-size: 1rem; margin-top: 16px; cursor: pointer; }
        canvas, video { max-width: 100%; max-height: 250px; border-radius: 12px; display: none; }
        .chat-box { height: 320px; background: #13131a; border-top: 1px solid #222; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; max-width: 85%; }
        .msg.ai { background: #1c1c28; align-self: flex-start; }
        .msg.user { background: #6366f1; align-self: flex-end; }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; background: #0a0a0c; }
        .chip { background: #1c1c28; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; white-space: nowrap; }
        .input-bar { padding: 10px; display: flex; gap: 8px; background: #13131a; }
        input[type="text"] { flex: 1; background: #1c1c28; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 20px; outline: none; }
        .btn-send { background: #6366f1; border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-weight: bold; }
    </style>
</head>
<body>
    <header>✨ Optima AI</header>
    
    <div class="stage">
        <div class="welcome" id="welcome">
            <h2>What would you like to edit?</h2>
            <p style="color:#888; font-size:0.85rem; margin-top:6px;">Upload a photo or video to begin.</p>
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">Upload Media</button>
        </div>
        <canvas id="canvas"></canvas>
        <video id="video" controls></video>
    </div>

    <div class="chat-box">
        <div class="messages" id="messages">
            <div class="msg ai">Hello! Upload a photo or video to get started.</div>
        </div>

        <div class="chips">
            <button class="chip" onclick="quickEdit('Make cinematic')">🎬 Cinematic</button>
            <button class="chip" onclick="quickEdit('Warm filter')">☀️ Warm</button>
            <button class="chip" onclick="quickEdit('Cool filter')">❄️ Cool</button>
            <button class="chip" onclick="quickEdit('Enhance quality')">✨ Enhance</button>
        </div>

        <div class="input-bar">
            <input type="file" id="file-input" accept="image/*,video/*" style="display:none;" onchange="loadFile(event)">
            <input type="text" id="text-input" placeholder="Type instruction..." onkeydown="if(event.key==='Enter') send()">
            <button class="btn-send" onclick="send()">➔</button>
        </div>
    </div>

    <script>
        let imgObj = null;

        function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const isVid = file.type.startsWith('video');
            const reader = new FileReader();

            reader.onload = function(evt) {
                document.getElementById('welcome').style.display = 'none';
                
                if (!isVid) {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    img.onload = function() {
                        imgObj = img;
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        canvas.style.display = 'block';
                        document.getElementById('video').style.display = 'none';
                    };
                    img.src = evt.target.result;
                } else {
                    const video = document.getElementById('video');
                    video.src = evt.target.result;
                    video.style.display = 'block';
                    document.getElementById('canvas').style.display = 'none';
                }

                addMsg('user', `Uploaded: ${file.name}`);
                addMsg('ai', "Media loaded! Tap a prompt below or type your instruction.");
            };
            reader.readAsDataURL(file);
        }

        function quickEdit(prompt) {
            document.getElementById('text-input').value = prompt;
            send();
        }

        function send() {
            const input = document.getElementById('text-input');
            const val = input.value.trim();
            if (!val) return;

            addMsg('user', val);
            input.value = '';

            setTimeout(() => {
                if (!imgObj) {
                    addMsg('ai', "Please tap 'Upload Media' to pick a photo first!");
                    return;
                }
                const lower = val.toLowerCase();
                if (lower.includes('cinematic')) {
                    applyFilter(1.2, 0.9, 1.1);
                    addMsg('ai', "Applied cinematic filter!");
                } else if (lower.includes('warm')) {
                    applyFilter(1.3, 1.1, 0.8);
                    addMsg('ai', "Applied warm style!");
                } else if (lower.includes('cool')) {
                    applyFilter(0.8, 1.0, 1.3);
                    addMsg('ai', "Applied cool style!");
                } else {
                    applyFilter(1.1, 1.1, 1.1);
                    addMsg('ai', `Applied edit: "${val}".`);
                }
            }, 400);
        }

        function applyFilter(rM, gM, bM) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgObj, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                d[i] = Math.min(255, d[i] * rM);
                d[i+1] = Math.min(255, d[i+1] * gM);
                d[i+2] = Math.min(255, d[i+2] * bM);
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function addMsg(sender, txt) {
            const box = document.getElementById('messages');
            const d = document.createElement('div');
            d.className = `msg ${sender}`;
            d.innerText = txt;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
